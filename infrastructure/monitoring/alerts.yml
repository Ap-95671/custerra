groups:
  - name: custerra
    rules:
      - alert: CusterraBackendMetricsUnavailable
        expr: up{job="custerra-backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Custerra private metrics unavailable
      - alert: CusterraApiErrors
        expr: |
          (sum(increase(http_server_requests_seconds_count{job="custerra-backend",status=~"5.."}[10m]))
          / clamp_min(sum(increase(http_server_requests_seconds_count{job="custerra-backend"}[10m])), 1) > 0.05)
          and sum(increase(http_server_requests_seconds_count{job="custerra-backend"}[10m])) >= 20
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Custerra API error ratio exceeds five percent
      - alert: CusterraProviderFailures
        expr: sum by (provider) (increase(custerra_provider_degraded_total{job="custerra-backend",state="UNAVAILABLE"}[10m])) >= 5
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Custerra provider repeatedly unavailable
      - alert: CusterraWorkerFailures
        expr: sum by (exported_job) (increase(custerra_job_failures_total{job="custerra-backend"}[10m])) > 0
        labels: {severity: warning}
        annotations:
          summary: Custerra background work failed
      - alert: CusterraPushDispatchFailures
        expr: sum(increase(custerra_notification_attempts_total{job="custerra-backend",outcome=~"FAILED|RETRY|UNCERTAIN"}[10m])) >= 3
        labels: {severity: warning}
        annotations:
          summary: Custerra push dispatch requires investigation
      - alert: CusterraJvmHeapPressure
        expr: |
          sum by (instance) (jvm_memory_used_bytes{job="custerra-backend",area="heap"})
          / sum by (instance) (jvm_memory_max_bytes{job="custerra-backend",area="heap"}) > 0.9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Custerra JVM heap usage exceeds ninety percent
