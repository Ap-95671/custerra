name: Feature request
description: Propose a specific improvement with a clear user need.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: need
    attributes:
      label: User problem
      description: Who needs this, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed behavior and scope
      description: Explain the expected workflow, alternatives and exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable outcomes, failure states, accessibility and provider/privacy constraints.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and costs
      description: Identify linked issues, data rights and infrastructure requirements. Paid services require separate owner approval.
